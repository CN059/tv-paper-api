[package]
name = "tv-paper-captor"
version = "0.1.0"
edition = "2021"
description = "Capture a TradingView paper-trading session and seal it for a tv-paper-api server"
license = "MIT"
repository = "https://github.com/CN059/tv-paper-api"

[dependencies]
# x11/wayland are explicit: with default-features off, winit cannot build on
# Linux without them, and they are inert on Windows and macOS.
eframe = { version = "0.32", default-features = false, features = [
    "glow",
    "default_fonts",
    "x11",
    "wayland",
] }
egui = "0.32"
ureq = { version = "2.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
p256 = { version = "0.13", features = ["ecdh", "pkcs8"] }
hkdf = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
rand = "0.8"
base64 = "0.22"
tungstenite = "0.24"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
