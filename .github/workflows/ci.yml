name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ---- server: types + tests -------------------------------------------------
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - name: Install server dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        # The end-to-end suite needs a running desktop app and skips itself here.
        run: bun test

  # ---- web console -----------------------------------------------------------
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.x'

      - name: Install console dependencies
        run: bun install --frozen-lockfile

      - name: Build console
        run: bun run build

  # ---- capture tool: three platforms -----------------------------------------
  captor:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: tv-paper-captor-windows-x64.exe
            binary: target/release/tv-paper-captor.exe
          - os: ubuntu-latest
            artifact: tv-paper-captor-linux-x64
            binary: target/release/tv-paper-captor
          - os: macos-latest
            artifact: tv-paper-captor-macos-arm64
            binary: target/release/tv-paper-captor

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/captor

      # egui needs these to link on Linux runners.
      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libxrandr-dev \
            libxi-dev libxcursor-dev libgl1-mesa-dev pkg-config

      - name: Test
        working-directory: tools/captor
        run: cargo test

      - name: Build release binary
        working-directory: tools/captor
        # A short target dir keeps the MSVC linker inside Windows' path limits.
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/release/${{ contains(matrix.os, 'windows') && 'tv-paper-captor.exe' || 'tv-paper-captor' }}
          if-no-files-found: error

  # ---- container image -------------------------------------------------------
  image:
    needs: [server, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # Pull requests build the image to catch breakage, but never publish.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---- release assets --------------------------------------------------------
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [captor]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish binaries
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
